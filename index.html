<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بروزرسانی سایت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap">
<style>
/* Layout: full-screen aurora + particles; centered stage with meshed gears, glowing typewriter line and an indeterminate bar below. Single dark look by design. */
:root {
  --bg: #060716;
  --fg: #eef0ff;
  --muted: #98a0d6;
  --blue: #4f7bff;
  --blue-hi: #8fb0ff;
  --violet: #9b5cff;
  --violet-hi: #c9a3ff;
  --cyan: #38d2ff;
  --font-body: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-inline: 16px;
  overflow-x: hidden;
}

.bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.blob {
  position: absolute;
  width: 62vmax;
  height: 62vmax;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.55;
  will-change: transform;
}
.blob.b1 { background: radial-gradient(circle, var(--blue), transparent 65%); top: -22vmax; left: -18vmax; animation: drift1 22s ease-in-out infinite alternate; }
.blob.b2 { background: radial-gradient(circle, var(--violet), transparent 65%); bottom: -26vmax; right: -20vmax; animation: drift2 26s ease-in-out infinite alternate; }
.blob.b3 { background: radial-gradient(circle, var(--cyan), transparent 65%); width: 34vmax; height: 34vmax; top: 30%; left: 55%; opacity: 0.22; animation: drift3 30s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(18vmax, 14vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-16vmax, -12vmax) scale(1.1); } }
@keyframes drift3 { to { transform: translate(-22vmax, 10vmax) scale(1.3); } }
.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(143, 176, 255, 0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(143, 176, 255, 0.07) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
  mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

main {
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  text-align: center;
  padding-block: 32px;
}
.stage {
  width: min(380px, 84vw);
  aspect-ratio: 300 / 220;
  perspective: 900px;
}
.tilt { width: 100%; height: 100%; transition: transform 0.25s ease-out; transform-style: preserve-3d; }
.tilt svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 0 14px rgba(110, 120, 255, 0.55)) drop-shadow(0 0 46px rgba(155, 92, 255, 0.35));
}
.ring { transform-origin: 50% 50%; }

.status {
  font-size: clamp(1.9rem, 8vw, 3.6rem);
  font-weight: 800;
  line-height: 1.5;
  min-height: 1.5em;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  filter: drop-shadow(0 0 22px rgba(125, 110, 255, 0.5));
}
#typed {
  background: linear-gradient(90deg, var(--blue-hi), var(--violet-hi), var(--cyan), var(--blue-hi));
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: sheen 6s linear infinite;
  padding-inline: 2px;
}
@keyframes sheen { to { background-position: -250% 0; } }
.cursor {
  width: 3px;
  height: 1.05em;
  border-radius: 2px;
  background: linear-gradient(var(--blue-hi), var(--violet));
  box-shadow: 0 0 14px var(--violet), 0 0 26px var(--blue);
  animation: blink 0.9s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.sub { color: var(--muted); font-weight: 300; font-size: clamp(0.95rem, 3.2vw, 1.1rem); margin: 0; letter-spacing: 0.01em; }

.bar {
  direction: ltr;
  position: relative;
  width: min(300px, 70vw);
  height: 4px;
  border-radius: 4px;
  background: rgba(143, 176, 255, 0.14);
  overflow: hidden;
  margin-top: 4px;
}
.bar::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 40%;
  border-radius: 4px;
  background: linear-gradient(90deg, transparent, var(--blue), var(--violet), transparent);
  box-shadow: 0 0 12px var(--violet);
  animation: run 1.9s ease-in-out infinite;
}
@keyframes run { from { left: -45%; } to { left: 105%; } }

@media (prefers-reduced-motion: reduce) {
  .blob, #typed, .bar::before { animation: none; }
  .bar::before { left: 30%; }
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<main dir="rtl" lang="fa">
  <div class="stage" aria-hidden="true">
    <div class="tilt" id="tilt">
      <svg id="gears" viewBox="50 40 300 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gs" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8fb0ff"/>
            <stop offset="0.55" stop-color="#9b5cff"/>
            <stop offset="1" stop-color="#38d2ff"/>
          </linearGradient>
          <linearGradient id="gf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4f7bff" stop-opacity="0.30"/>
            <stop offset="1" stop-color="#9b5cff" stop-opacity="0.12"/>
          </linearGradient>
        </defs>
        <circle class="ring" cx="200" cy="150" r="128" fill="none" stroke="url(#gs)" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 9" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 200 150" to="360 200 150" dur="60s" repeatCount="indefinite"/>
        </circle>
        <g id="gear-layer"></g>
      </svg>
    </div>
  </div>

  <div class="status" role="status" aria-live="polite">
    <span id="typed">در حال بروزرسانی</span><span class="cursor" aria-hidden="true"></span>
  </div>
  <p class="sub">چند لحظه دیگر با نسخه جدید برمی‌گردیم</p>
  <div class="bar" aria-hidden="true"></div>
</main>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Gears: three meshed gears, speeds follow tooth counts ---------- */
  var NS = "http://www.w3.org/2000/svg";
  var layer = document.getElementById("gear-layer");
  var M = 10; // module: pitch radius = M * teeth / 2

  function gearPath(n, off) {
    var rp = M * n / 2, ro = rp + M * 0.55, ri = rp - M * 0.65, step = 2 * Math.PI / n;
    function P(a, r) { return [r * Math.cos(a), r * Math.sin(a)]; }
    var d = "";
    for (var i = 0; i < n; i++) {
      var a = off + i * step;
      var p1 = P(a - 0.31 * step, ri), p2 = P(a - 0.15 * step, ro), p3 = P(a + 0.15 * step, ro), p4 = P(a + 0.31 * step, ri);
      var nx = P(a + step - 0.31 * step, ri);
      d += (i ? "L" : "M") + p1[0].toFixed(2) + " " + p1[1].toFixed(2) +
           "L" + p2[0].toFixed(2) + " " + p2[1].toFixed(2) +
           "L" + p3[0].toFixed(2) + " " + p3[1].toFixed(2) +
           "L" + p4[0].toFixed(2) + " " + p4[1].toFixed(2) +
           "A" + ri + " " + ri + " 0 0 1 " + nx[0].toFixed(2) + " " + nx[1].toFixed(2);
    }
    d += "Z";
    var h = rp * 0.3;
    d += "M" + h + " 0A" + h + " " + h + " 0 1 0 " + (-h) + " 0A" + h + " " + h + " 0 1 0 " + h + " 0Z";
    return d;
  }

  function addGear(cx, cy, n, off, dir, period) {
    var g = document.createElementNS(NS, "g");
    g.setAttribute("transform", "translate(" + cx + " " + cy + ")");
    var rot = document.createElementNS(NS, "g");
    var p = document.createElementNS(NS, "path");
    p.setAttribute("d", gearPath(n, off));
    p.setAttribute("fill", "url(#gf)");
    p.setAttribute("fill-rule", "evenodd");
    p.setAttribute("stroke", "url(#gs)");
    p.setAttribute("stroke-width", "1.7");
    p.setAttribute("stroke-linejoin", "round");
    rot.appendChild(p);
    var rp = M * n / 2;
    [0.58, 0.46].forEach(function (k, idx) {
      var c = document.createElementNS(NS, "circle");
      c.setAttribute("r", rp * k);
      c.setAttribute("fill", "none");
      c.setAttribute("stroke", "url(#gs)");
      c.setAttribute("stroke-opacity", idx ? "0.25" : "0.5");
      c.setAttribute("stroke-width", "1");
      if (idx) c.setAttribute("stroke-dasharray", "3 5");
      rot.appendChild(c);
    });
    if (!reduce) {
      var an = document.createElementNS(NS, "animateTransform");
      an.setAttribute("attributeName", "transform");
      an.setAttribute("type", "rotate");
      an.setAttribute("from", "0 0 0");
      an.setAttribute("to", (dir * 360) + " 0 0");
      an.setAttribute("dur", period + "s");
      an.setAttribute("repeatCount", "indefinite");
      rot.appendChild(an);
    }
    g.appendChild(rot);
    layer.appendChild(g);
  }

  var nA = 14, nB = 9, nC = 7, T = 22;
  var ax = 150, ay = 170, th = -0.55;
  var dAB = M * (nA + nB) / 2;
  var bx = ax + dAB * Math.cos(th), by = ay + dAB * Math.sin(th);
  var offA = th, offB = th + Math.PI + Math.PI / nB;
  // pick a tooth of B that points toward C, then give C a gap facing it
  var stepB = 2 * Math.PI / nB, target = 1.0;
  var j = Math.round((target - offB) / stepB), phi = offB + j * stepB;
  var dBC = M * (nB + nC) / 2;
  var cx = bx + dBC * Math.cos(phi), cy = by + dBC * Math.sin(phi);
  var offC = phi + Math.PI + Math.PI / nC;

  addGear(ax, ay, nA, offA, 1, T);
  addGear(bx, by, nB, offB, -1, T * nB / nA);
  addGear(cx, cy, nC, offC, 1, T * nC / nA);

  /* ---------- Gentle 3D tilt that follows the pointer ---------- */
  var tilt = document.getElementById("tilt");
  if (!reduce) {
    window.addEventListener("pointermove", function (e) {
      var x = e.clientX / window.innerWidth - 0.5, y = e.clientY / window.innerHeight - 0.5;
      tilt.style.transform = "rotateY(" + (x * 18).toFixed(2) + "deg) rotateX(" + (-y * 14).toFixed(2) + "deg)";
    }, { passive: true });
  }

  /* ---------- Typewriter ---------- */
  var text = "در حال بروزرسانی";
  var el = document.getElementById("typed");
  if (reduce) {
    el.textContent = text;
  } else {
    var i = 0, deleting = false;
    (function tick() {
      el.textContent = text.slice(0, i) || "​";
      var delay = deleting ? 55 : 115;
      if (!deleting && i === text.length) { deleting = true; delay = 1800; }
      else if (deleting && i === 0) { deleting = false; delay = 600; }
      else { i += deleting ? -1 : 1; }
      setTimeout(tick, delay);
    })();
  }

  /* ---------- Particle network ---------- */
  var cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), pts = [], mouse = { x: -999, y: -999 };
  function size() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.max(28, Math.min(90, Math.round(W * H / 16000)));
    pts = [];
    for (var k = 0; k < n; k++) {
      pts.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.28, vy: (Math.random() - 0.5) * 0.28, r: Math.random() * 1.4 + 0.5, v: Math.random() < 0.4 });
    }
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (var a = 0; a < pts.length; a++) {
      var p = pts[a];
      if (!reduce) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = p.v ? "rgba(201,163,255,0.85)" : "rgba(143,176,255,0.85)";
      ctx.fill();
      for (var b = a + 1; b < pts.length; b++) {
        var q = pts[b], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
        if (d2 < 14000) {
          ctx.strokeStyle = "rgba(140,150,255," + (0.22 * (1 - d2 / 14000)).toFixed(3) + ")";
          ctx.lineWidth = 0.7;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
      }
      var mx = p.x - mouse.x, my = p.y - mouse.y, md = mx * mx + my * my;
      if (md < 22000) {
        ctx.strokeStyle = "rgba(56,210,255," + (0.35 * (1 - md / 22000)).toFixed(3) + ")";
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  window.addEventListener("resize", function () { size(); if (reduce) frame(); });
  window.addEventListener("pointermove", function (e) { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  size();
  frame();
})();
</script>
</body>
</html>
